# Copy the relevant sections into a dedicated Hermes profile.
# Configure the model/provider separately with `hermes --profile <name> model`.

terminal:
  home_mode: profile

agent:
  verify_on_stop: true

plugins:
  enabled:
    - career-document-production
  disabled: []
  entries:
    career-document-production:
      allow_tool_override: false

# Start with the minimum read/draft tool surface.
# Add messaging, cron, cloud, Kanban, or browser integrations only after
# reviewing their authority and updating the profile contract.
platform_toolsets:
  cli:
    - clarify
    - file
    - resume_production
    - skills
    - todo
    - vision
    - web
  discord:
    - clarify
    - file
    - resume_production
    - skills
    - todo
    - vision
    - web
