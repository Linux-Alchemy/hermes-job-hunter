      runtime_result: DEGRADED
      limitation: indexed_snippet_only
    posting:
      title: Implementation Analyst
      employer: Meridian Works
      discovery_url: "https://index.example.invalid/meridian/implementation"
      employer_url: UNKNOWN
      employer_page_state: UNKNOWN
      work_mode: REMOTE
